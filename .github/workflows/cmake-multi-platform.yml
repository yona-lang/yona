name: CMake Multi-Platform Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: Linux Debug
            configure_preset: x64-debug-linux
            build_preset: build-debug-linux
            build_dir: x64-debug-linux
          - os: ubuntu-26.04
            name: Linux Release
            configure_preset: x64-release-linux
            build_preset: build-release-linux
            build_dir: x64-release-linux
          - os: ubuntu-26.04-arm
            name: Linux arm64 Debug
            configure_preset: arm64-debug-linux
            build_preset: build-debug-linux-arm64
            build_dir: arm64-debug-linux
          - os: ubuntu-26.04-arm
            name: Linux arm64 Release
            configure_preset: arm64-release-linux
            build_preset: build-release-linux-arm64
            build_dir: arm64-release-linux
          - os: macos-26
            name: macOS Debug
            configure_preset: x64-debug-macos
            build_preset: build-debug-macos
            build_dir: x64-debug-macos
          - os: macos-26
            name: macOS Release
            configure_preset: x64-release-macos
            build_preset: build-release-macos
            build_dir: x64-release-macos
          - os: windows-2025
            name: Windows Debug
            configure_preset: x64-debug
            build_preset: build-debug
            build_dir: x64-debug
          - os: windows-2025
            name: Windows Release
            configure_preset: x64-release
            build_preset: build-release
            build_dir: x64-release

    steps:
    - uses: actions/checkout@v4

    - name: Set up LLVM
      uses: ./.github/actions/setup-llvm

    - name: Configure
      run: cmake --preset ${{ matrix.configure_preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Report embedded LLD
      if: success()
      shell: bash
      run: |
        PY="$(command -v python3 || command -v python)"
        "$PY" scripts/ci/report-embedded-lld.py "out/build/${{ matrix.build_dir }}/CMakeCache.txt" "${{ matrix.name }}"

    - name: Validate linker modes
      if: success() && runner.os != 'Windows'
      run: bash scripts/ci/validate-linker-modes.sh "out/build/${{ matrix.build_dir }}"

    - name: Validate linker modes
      if: success() && runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/ci/validate-linker-modes.ps1 -BuildDir "out/build/${{ matrix.build_dir }}"

    - name: Test
      if: success()
      run: ctest --test-dir "out/build/${{ matrix.build_dir }}" --output-on-failure --output-junit test-results.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.name }}
        path: |
          **/test-results.xml

    - name: Parse test results
      if: always()
      shell: bash
      run: |
        TEST_FILE="$(find . -name test-results.xml -type f | head -n 1)"
        if [ ! -f "$TEST_FILE" ]; then
          echo "⚠️ No test results found for ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        TOTAL="$(grep -o 'tests="[0-9]*"' "$TEST_FILE" | sed 's/tests="//;s/"//g' | head -n 1)"
        FAILURES="$(grep -o 'failures="[0-9]*"' "$TEST_FILE" | sed 's/failures="//;s/"//g' | head -n 1)"
        ERRORS="$(grep -o 'errors="[0-9]*"' "$TEST_FILE" | sed 's/errors="//;s/"//g' | head -n 1)"
        TOTAL="${TOTAL:-0}"
        FAILURES="${FAILURES:-0}"
        ERRORS="${ERRORS:-0}"
        PASSED="$((TOTAL - FAILURES - ERRORS))"
        {
          echo "### Test Results for ${{ matrix.name }}"
          echo ""
          echo "| Status | Count |"
          echo "|--------|-------|"
          echo "| ✅ Passed | $PASSED |"
          echo "| ❌ Failed | $FAILURES |"
          echo "| 🔥 Errors | $ERRORS |"
          echo "| 📊 Total | $TOTAL |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Tests - ${{ matrix.name }}
        path: '**/test-results.xml'
        reporter: java-junit
        fail-on-error: 'false'
        fail-on-empty: 'false'

  test-summary:
    name: Test Summary
    needs: build
    runs-on: ubuntu-26.04
    if: always()
    steps:
    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*

    - name: Create test summary
      run: |
        echo "# 📊 Test Results Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Platform | Total | ✅ Passed | ❌ Failed | 🔥 Errors | Status |" >> "$GITHUB_STEP_SUMMARY"
        echo "|----------|-------|-----------|-----------|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"

        TOTAL_ALL=0
        PASSED_ALL=0
        FAILED_ALL=0
        ERRORS_ALL=0

        for dir in test-results-*; do
          [ -d "$dir" ] || continue
          PLATFORM="${dir#test-results-}"
          file="$(find "$dir" -name test-results.xml -type f | head -n 1)"
          [ -f "$file" ] || continue
          TOTAL="$(grep -o 'tests="[0-9]*"' "$file" | sed 's/tests="//;s/"//g' | head -n 1)"
          FAILURES="$(grep -o 'failures="[0-9]*"' "$file" | sed 's/failures="//;s/"//g' | head -n 1)"
          ERRORS="$(grep -o 'errors="[0-9]*"' "$file" | sed 's/errors="//;s/"//g' | head -n 1)"
          TOTAL="${TOTAL:-0}"
          FAILURES="${FAILURES:-0}"
          ERRORS="${ERRORS:-0}"
          PASSED="$((TOTAL - FAILURES - ERRORS))"
          TOTAL_ALL="$((TOTAL_ALL + TOTAL))"
          PASSED_ALL="$((PASSED_ALL + PASSED))"
          FAILED_ALL="$((FAILED_ALL + FAILURES))"
          ERRORS_ALL="$((ERRORS_ALL + ERRORS))"
          if [ "$FAILURES" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then STATUS="✅"; else STATUS="❌"; fi
          echo "| $PLATFORM | $TOTAL | $PASSED | $FAILURES | $ERRORS | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
        done

        echo "| **TOTAL** | **$TOTAL_ALL** | **$PASSED_ALL** | **$FAILED_ALL** | **$ERRORS_ALL** | - |" >> "$GITHUB_STEP_SUMMARY"
        if [ "$TOTAL_ALL" -gt 0 ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📈 Success Rate: $(( (PASSED_ALL * 100) / TOTAL_ALL ))%" >> "$GITHUB_STEP_SUMMARY"
        fi
