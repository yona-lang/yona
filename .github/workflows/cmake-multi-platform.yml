name: CMake Multi-Platform Build

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: Linux Debug
            configure_preset: x64-debug-linux
            build_preset: build-debug-linux
            build_dir: x64-debug-linux
          - os: ubuntu-26.04
            name: Linux Release
            configure_preset: x64-release-linux
            build_preset: build-release-linux
            build_dir: x64-release-linux
          - os: ubuntu-26.04-arm
            name: Linux arm64 Debug
            configure_preset: arm64-debug-linux
            build_preset: build-debug-linux-arm64
            build_dir: arm64-debug-linux
          - os: ubuntu-26.04-arm
            name: Linux arm64 Release
            configure_preset: arm64-release-linux
            build_preset: build-release-linux-arm64
            build_dir: arm64-release-linux
          - os: macos-26
            name: macOS arm64 Debug
            configure_preset: arm64-debug-macos
            build_preset: build-debug-macos-arm64
            build_dir: arm64-debug-macos
          - os: macos-26
            name: macOS arm64 Release
            configure_preset: arm64-release-macos
            build_preset: build-release-macos-arm64
            build_dir: arm64-release-macos
          - os: windows-2025
            name: Windows x64 Debug
            configure_preset: x64-debug
            build_preset: build-debug
            build_dir: x64-debug
            arch: x64
          - os: windows-2025
            name: Windows x64 Release
            configure_preset: x64-release
            build_preset: build-release
            build_dir: x64-release
            arch: x64
          - os: windows-11-vs2026-arm
            name: Windows arm64 Debug
            configure_preset: arm64-debug
            build_preset: build-debug-arm64
            build_dir: arm64-debug
            arch: arm64
          - os: windows-11-vs2026-arm
            name: Windows arm64 Release
            configure_preset: arm64-release
            build_preset: build-release-arm64
            build_dir: arm64-release
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check TextMate grammar sync
        if: runner.os == 'Linux'
        run: ./scripts/check-yona-grammar.sh

      - name: Set up LLVM
        uses: ./.github/actions/setup-llvm
        with:
          windows-architecture: ${{ matrix.arch }}

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Smoke yls
        if: success()
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          YLS="out/build/${{ matrix.build_dir }}/yls"
          if [ "${{ runner.os }}" = "Windows" ]; then
            YLS="${YLS}.exe"
          fi
          "$PY" scripts/ci/smoke_yls.py "$YLS"

      - name: Smoke yls-yona
        if: success()
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          YLSY="out/build/${{ matrix.build_dir }}/yls-yona"
          if [ "${{ runner.os }}" = "Windows" ]; then
            YLSY="${YLSY}.exe"
          fi
          "$PY" scripts/ci/smoke_yls_yona.py "$YLSY"

      - name: Report embedded LLD
        if: success()
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/ci/report_embedded_lld.py "out/build/${{ matrix.build_dir }}/CMakeCache.txt" "${{ matrix.name }}"

      - name: Validate linker modes
        if: success() && runner.os != 'Windows'
        run:
          bash scripts/ci/validate-linker-modes.sh "out/build/${{
          matrix.build_dir }}"

      - name: Validate linker modes
        if: success() && runner.os == 'Windows'
        shell: pwsh
        run:
          ./scripts/ci/validate-linker-modes.ps1 -BuildDir "out/build/${{
          matrix.build_dir }}"

      - name: Test
        if: success()
        run:
          ctest --test-dir "out/build/${{ matrix.build_dir }}"
          --output-on-failure --output-junit "${{ github.workspace
          }}/test-results.xml"

      - name: Collect test results
        if: always()
        shell: bash
        run: |
          mkdir -p collected-results
          if [ -f test-results.xml ]; then
            cp test-results.xml collected-results/
          fi
          for f in "out/build/${{ matrix.build_dir }}"/doctest*.xml; do
            if [ -f "$f" ]; then
              cp "$f" collected-results/
            fi
          done

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: collected-results/*
          if-no-files-found: ignore

      - name: Parse test results
        if: always()
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          files=()
          for f in collected-results/doctest*.xml collected-results/test-results.xml; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JUnit XML to summarize" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$PY" scripts/ci/summarize_junit.py --title "${{ matrix.name }}" "${files[@]}"

      - name: Test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests - ${{ matrix.name }}
          path: collected-results/doctest*.xml
          reporter: java-junit
          fail-on-error: "false"
          fail-on-empty: "false"

  test-summary:
    name: Test Summary
    needs: build
    runs-on: ubuntu-26.04
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*

      - name: Create test summary
        run: |
          files=()
          for dir in test-results-*; do
            [ -d "$dir" ] || continue
            found=0
            for f in "$dir"/doctest*.xml; do
              if [ -f "$f" ]; then
                files+=("$f")
                found=1
              fi
            done
            if [ "$found" -eq 0 ] && [ -f "$dir/test-results.xml" ]; then
              files+=("$dir/test-results.xml")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No test-results.xml artifacts" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/ci/summarize_junit.py --table "${files[@]}"

  # Package only. Marketplace / Open VSX publish lives in release.yml (v* tags).
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check TextMate grammar sync
        run: ./scripts/check-yona-grammar.sh

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Test and package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run lint
          npm test
          npm run vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: yona-vscode-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error
