name: CMake Multi-Platform Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: Linux Debug
            configure_preset: x64-debug-linux
            build_preset: build-debug-linux
            build_dir: x64-debug-linux
          - os: ubuntu-26.04
            name: Linux Release
            configure_preset: x64-release-linux
            build_preset: build-release-linux
            build_dir: x64-release-linux
          - os: ubuntu-26.04-arm
            name: Linux arm64 Debug
            configure_preset: arm64-debug-linux
            build_preset: build-debug-linux-arm64
            build_dir: arm64-debug-linux
          - os: ubuntu-26.04-arm
            name: Linux arm64 Release
            configure_preset: arm64-release-linux
            build_preset: build-release-linux-arm64
            build_dir: arm64-release-linux
          - os: macos-26
            name: macOS Debug
            configure_preset: x64-debug-macos
            build_preset: build-debug-macos
            build_dir: x64-debug-macos
          - os: macos-26
            name: macOS Release
            configure_preset: x64-release-macos
            build_preset: build-release-macos
            build_dir: x64-release-macos
          - os: windows-2025
            name: Windows Debug
            configure_preset: x64-debug
            build_preset: build-debug
            build_dir: x64-debug
          - os: windows-2025
            name: Windows Release
            configure_preset: x64-release
            build_preset: build-release
            build_dir: x64-release

    steps:
    - uses: actions/checkout@v4

    - name: Set up LLVM
      uses: ./.github/actions/setup-llvm

    - name: Configure
      run: cmake --preset ${{ matrix.configure_preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}

    - name: Report embedded LLD
      if: success()
      shell: bash
      run: |
        PY="$(command -v python3 || command -v python)"
        "$PY" scripts/ci/report-embedded-lld.py "out/build/${{ matrix.build_dir }}/CMakeCache.txt" "${{ matrix.name }}"

    - name: Validate linker modes
      if: success() && runner.os != 'Windows'
      run: bash scripts/ci/validate-linker-modes.sh "out/build/${{ matrix.build_dir }}"

    - name: Validate linker modes
      if: success() && runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/ci/validate-linker-modes.ps1 -BuildDir "out/build/${{ matrix.build_dir }}"

    - name: Test
      if: success()
      run: ctest --test-dir "out/build/${{ matrix.build_dir }}" --output-on-failure --output-junit "${{ github.workspace }}/test-results.xml"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.name }}
        path: test-results.xml
        if-no-files-found: ignore

    - name: Parse test results
      if: always()
      shell: bash
      run: |
        PY="$(command -v python3 || command -v python)"
        "$PY" scripts/ci/summarize-junit.py --title "${{ matrix.name }}" test-results.xml

    - name: Test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Tests - ${{ matrix.name }}
        path: test-results.xml
        reporter: java-junit
        fail-on-error: 'false'
        fail-on-empty: 'false'

  test-summary:
    name: Test Summary
    needs: build
    runs-on: ubuntu-26.04
    if: always()
    steps:
    - uses: actions/checkout@v4

    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*

    - name: Create test summary
      run: |
        files=()
        for dir in test-results-*; do
          [ -f "$dir/test-results.xml" ] || continue
          files+=("$dir/test-results.xml")
        done
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No test-results.xml artifacts" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python3 scripts/ci/summarize-junit.py --table "${files[@]}"
