name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM
        uses: ./.github/actions/setup-llvm

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcre2-dev

      - name: Build release
        run: |
          cmake --preset x64-release-linux
          cmake --build --preset build-release-linux

      - name: Report embedded LLD
        run: python3 scripts/ci/report-embedded-lld.py out/build/x64-release-linux/CMakeCache.txt "Linux release"

      - name: Run tests
        run: ctest --test-dir out/build/x64-release-linux --output-on-failure

      - name: Validate linker modes
        run: bash scripts/ci/validate-linker-modes.sh out/build/x64-release-linux

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DIST=yona-${VERSION}-linux-${{ matrix.arch }}
          mkdir -p ${DIST}/bin ${DIST}/lib/Std ${DIST}/runtime ${DIST}/src/runtime/platform ${DIST}/include/yona/runtime
          cp out/build/x64-release-linux/yonac ${DIST}/bin/
          cp out/build/x64-release-linux/yona ${DIST}/bin/
          cp lib/Std/*.yona* ${DIST}/lib/Std/ 2>/dev/null || true
          cp out/build/x64-release-linux/runtime/* ${DIST}/runtime/ 2>/dev/null || true
          cp src/compiled_runtime.c ${DIST}/src/
          cp src/runtime/*.c ${DIST}/src/runtime/ 2>/dev/null || true
          cp src/runtime/*.h ${DIST}/src/runtime/ 2>/dev/null || true
          cp src/runtime/platform/* ${DIST}/src/runtime/platform/
          cp include/yona/runtime/*.h ${DIST}/include/yona/runtime/
          cp LICENSE.txt README.md INSTALL.md CHANGELOG.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: yona-*-linux-*.tar.gz

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM
        uses: ./.github/actions/setup-llvm

      - name: Install dependencies
        run: brew install pcre2

      - name: Build release
        run: |
          cmake --preset x64-release-macos
          cmake --build --preset build-release-macos

      - name: Report embedded LLD
        run: python3 scripts/ci/report-embedded-lld.py out/build/x64-release-macos/CMakeCache.txt "macOS release"

      - name: Validate linker modes
        run: bash scripts/ci/validate-linker-modes.sh out/build/x64-release-macos

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DIST=yona-${VERSION}-macos-$(uname -m)
          mkdir -p ${DIST}/bin ${DIST}/lib/Std ${DIST}/runtime ${DIST}/src/runtime/platform ${DIST}/include/yona/runtime
          cp out/build/x64-release-macos/yonac ${DIST}/bin/
          cp out/build/x64-release-macos/yona ${DIST}/bin/
          cp lib/Std/*.yona* ${DIST}/lib/Std/ 2>/dev/null || true
          cp out/build/x64-release-macos/runtime/* ${DIST}/runtime/ 2>/dev/null || true
          cp src/compiled_runtime.c ${DIST}/src/
          cp src/runtime/*.c ${DIST}/src/runtime/ 2>/dev/null || true
          cp src/runtime/*.h ${DIST}/src/runtime/ 2>/dev/null || true
          cp src/runtime/platform/* ${DIST}/src/runtime/platform/
          cp include/yona/runtime/*.h ${DIST}/include/yona/runtime/
          cp LICENSE.txt README.md INSTALL.md CHANGELOG.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: yona-*-macos-*.tar.gz

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM
        uses: ./.github/actions/setup-llvm

      - name: Install WiX v4 CLI
        shell: pwsh
        run: |
          $installed = dotnet tool list --global | Select-String -Pattern '^\s*wix\s+'
          if ($installed) {
            dotnet tool update --global wix --version 4.*
          } else {
            dotnet tool install --global wix --version 4.*
          }
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          wix --version

      - name: Build release
        shell: pwsh
        run: |
          cmake --preset x64-release
          cmake --build --preset build-release

      - name: Report embedded LLD
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/ci/report-embedded-lld.py out/build/x64-release/CMakeCache.txt "Windows release"

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir out/build/x64-release --output-on-failure

      - name: Validate linker modes
        shell: pwsh
        run: ./scripts/ci/validate-linker-modes.ps1 -BuildDir "out/build/x64-release"

      - name: Package (zip + msi)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          ./packaging/windows/build-msi.ps1 -BuildDir "out/build/x64-release" -Version $version

          $stageDir = "out/installer/windows/stage"
          $zipPath = "yona-$version-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath
          Copy-Item "out/installer/windows/yona-$version-windows-x64.msi" "."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            yona-*-windows-*.zip
            yona-*-windows-*.msi

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yona-*.tar.gz
            yona-*-windows-*.zip
            yona-*-windows-*.msi
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  aur:
    needs: [release]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate PKGBUILD
        run: bash dist/ci/generate-aur-pkgbuild.sh "${GITHUB_REF_NAME#v}" ./PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: yona-bin
          pkgbuild: ./PKGBUILD
          updpkgsums: true
          commit_username: akovari
          commit_email: adam@kovari.eu
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

  copr:
    needs: [release]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install copr-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools
          pip3 install --user 'copr-cli'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure & build on Copr
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config
          {
            echo '[copr-cli]'
            echo "login = ${COPR_LOGIN}"
            echo "username = ${COPR_USERNAME}"
            echo "token = ${COPR_TOKEN}"
            echo 'copr_url = https://copr.fedorainfracloud.org'
          } > ~/.config/copr
          PROJECT="${COPR_USERNAME}/yona"
          TAG="${GITHUB_REF_NAME}"
          echo "Building on Copr project ${PROJECT} from ${TAG}"
          copr-cli buildscm "$PROJECT" \
              --clone-url "https://github.com/yona-lang/yonac-llvm.git" \
              --commit "$TAG" \
              --spec dist/copr/yona.spec \
              --enable-net on

  launchpad:
    needs: [release]
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper devscripts dput dpkg-dev

      - name: Import GPG key
        env:
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$LAUNCHPAD_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR="${{ secrets.LAUNCHPAD_GPG_FINGERPRINT }}"
          echo "${FPR}:6:" | gpg --import-ownertrust
          gpg --list-secret-keys

      - name: Build source package and dput
        env:
          LAUNCHPAD_PPA: ${{ secrets.LAUNCHPAD_PPA }}
          LAUNCHPAD_GPG_KEY_ID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
          DEBSIGN_KEYID: ${{ secrets.LAUNCHPAD_GPG_KEY_ID }}
        run: |
          chmod +x dist/ci/*.sh
          bash dist/ci/launchpad-upload.sh "${GITHUB_REF_NAME#v}"
