[tool.ruff]
line-length = 80
target-version = "py311"
extend-exclude = [
  "out",
  "build",
  "site/node_modules",
  "editors/vscode/node_modules",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
